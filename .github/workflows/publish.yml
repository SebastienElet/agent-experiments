name: Publish
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        include:
          - os: macos-26
            variant: darwin-arm64
          - os: ubuntu-24.04
            variant: linux-x64-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: cargo test --all-features --locked
      - run: bun run build
      - run: bun test tests/launcher.test.mjs
      - run: bun pm pack --destination ../../dist
        working-directory: packages/${{ matrix.variant }}
      - run: npm publish dist/sebastienelet-agent-experiments-${{ matrix.variant }}-0.0.1.tgz --provenance --access public --registry https://registry.npmjs.org --ignore-scripts
  entry:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: bun pm pack --destination dist
      - run: npm publish dist/sebastienelet-agent-experiments-0.0.1.tgz --provenance --access public --registry https://registry.npmjs.org --ignore-scripts
